<text x="342" y="291" fill="#e8edf5" font-size="14" font-family="Segoe UI, Arial, sans-serif">O</text>
<text x="354" y="55" fill="#c4d1e2" font-size="15" font-family="Segoe UI, Arial, sans-serif">+Z (Nord)</text>
<text x="353" y="602" fill="#c4d1e2" font-size="15" font-family="Segoe UI, Arial, sans-serif">−Z (Sud)</text>
<rect x="655" y="140" width="380" height="475" rx="18" fill="#1e2d44" stroke="#354860"/>
<text x="680" y="187" fill="#fafcff" font-size="23" font-family="Segoe UI, Arial, sans-serif" font-weight="700">7 sommets · 21 liaisons</text>
<circle cx="688" cy="223" r="8" fill="#f4c35a"/><text x="710" y="229" fill="#e4eaf4" font-size="16" font-family="Segoe UI, Arial, sans-serif">4 sommets supérieurs (Nord inclus)</text>
<circle cx="688" cy="260" r="8" fill="#8cc8ed"/><text x="710" y="266" fill="#e4eaf4" font-size="16" font-family="Segoe UI, Arial, sans-serif">3 sommets inférieurs (Sud inclus)</text>
<text x="680" y="313" fill="#f4c35a" font-size="17" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Angle depuis l'axe Z : 60°</text>
<text x="680" y="345" fill="#d0dbe9" font-size="16" font-family="Segoe UI, Arial, sans-serif">Niveaux z = ±R, ±R/2</text>
<text x="680" y="389" fill="#e7eff9" font-size="17" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Six familles de distances</text>
<text x="680" y="425" fill="#d0dbe9" font-size="18" font-family="Consolas, monospace">{4, 7, 9, 12, 13, 16}</text>
<text x="680" y="454" fill="#9daec5" font-size="14" font-family="Segoe UI, Arial, sans-serif">k = 4 × distance² / R²</text>
<text x="680" y="504" fill="#e7eff9" font-size="17" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Barycentre G = (0, 0, R/14)</text>
<text x="680" y="550" fill="#b3c2d6" font-size="14" font-family="Segoe UI, Arial, sans-serif">Les 21 traits pâles relient les 7 points.</text>
<text x="680" y="575" fill="#b3c2d6" font-size="14" font-family="Segoe UI, Arial, sans-serif">Le centre O n'est pas un 8e sommet.</text>
<text x="55" y="645" fill="#94a6bc" font-size="14" font-family="Segoe UI, Arial, sans-serif">Représentation orthographique schématique calculée à partir des coordonnées exactes ; les projections ne conservent pas les distances.</text>
</svg>